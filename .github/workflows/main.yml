name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع (بما فيه ملف الـ zip)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. فك ضغط ملف my-apk.zip
      - name: Unzip Project Files
        run: |
          unzip my-apk.zip -d extracted_project
          # استعراض الملفات للتأكد من فك الضغط بنجاح
          ls -la extracted_project

      # 3. إعداد بيئة جافا (Java JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. إعطاء صلاحية التشغيل لملف gradlew داخل المجلد المستخرج
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew
        working-directory: extracted_project

      # 5. بناء نسخة الـ APK (Debug)
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        working-directory: extracted_project

      # 6. استخراج ملف الـ APK ورفعه كناتج (Artifact) لتحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
