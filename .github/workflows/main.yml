name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. فك ضغط ملف المشروع وحذف ملف الـ JAR التالف
      - name: Unzip Project Files and Clean Wrapper
        run: |
          unzip my-apk.zip -d extracted_project
          find extracted_project -name "gradle-wrapper.jar" -exec rm -f {} \;
          echo "تم فك الضغط وحذف الـ wrapper التالف!"

      # 3. إعداد بيئة جافا (Java JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت Node.js (مطلوب لتهيئة حزم Capacitor و node_modules)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 5. تهيئة حزم الـ node_modules المطلوبة لبناء الأندرويد
      - name: Install Capacitor Dependencies
        run: |
          # سنقوم بإنشاء مجلد node_modules وتثبيت حزم Capacitor فيه تلقائياً
          cd extracted_project
          npm init -y
          npm install @capacitor/core @capacitor/android
          # عمل مزامنة سريعة لضمان ربط المجلدات
          npx cap sync android || true

      # 6. تثبيت أداة Gradle نظيفة ومستقرة وتخطي فحص الملف التالف
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # 7. بناء التطبيق وتوليد الـ APK مباشرة
      - name: Build APK with Global Gradle
        run: |
          cd extracted_project/my-apk
          gradle assembleDebug

      # 8. استخراج ملف الـ APK الناتج ورفعه للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 'extracted_project/my-apk/app/build/outputs/apk/debug/*.apk'
