name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. فك ضغط ملف المشروع
      - name: Unzip Project Files
        run: |
          unzip my-apk.zip -d extracted_project

      # 3. إعداد بيئة جافا (Java JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت أداة Gradle نظيفة على السيرفر لتخطي الـ wrapper التالف
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. بناء نسخة الـ APK باستخدام Gradle المثبت على النظام مباشرة
      - name: Build APK with Installed Gradle
        run: |
          # البحث عن المجلد الذي يحتوي على ملف build.gradle
          BUILD_FILE_PATH=$(find extracted_project -name "build.gradle" | head -n 1)
          
          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "خطأ: لم يتم العثور على ملف build.gradle في المشروع المستخرج!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE_PATH")
          echo "تم العثور على مجلد المشروع الرئيسي في: $PROJECT_DIR"
          
          # الانتقال للمجلد وبناء التطبيق باستخدام أداة gradle العالمية بدلاً من ./gradlew
          cd "$PROJECT_DIR"
          gradle assembleDebug

      # 6. رفع ملف الـ APK الناتج لتحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
