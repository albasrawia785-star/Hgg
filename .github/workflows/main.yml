name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من مستودع GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (Java JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعطاء صلاحية التشغيل لملف gradlew داخل مجلد my-apk
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew
        working-directory: my-apk

      # 4. بناء نسخة الـ APK (Debug) داخل مجلد my-apk
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        working-directory: my-apk

      # 5. استخراج ملف الـ APK ورفعه كناتج (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my-apk/app/build/outputs/apk/debug/app-debug.apk
