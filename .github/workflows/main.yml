name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. فك ضغط ملف المشروع وحذف ملف الـ JAR التالف فوراً
      - name: Unzip Project Files and Clean Wrapper
        run: |
          unzip my-apk.zip -d extracted_project
          
          # حذف ملف wrapper التالف نهائياً لتجنب توقف أدوات الحماية والتحقق
          find extracted_project -name "gradle-wrapper.jar" -exec rm -f {} \;
          echo "تم فك الضغط وحذف الـ wrapper التالف!"

      # 3. إعداد بيئة جافا المتوافقة (Java JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت أداة Gradle نظيفة ومستقرة وتخطي فحص الملف التالف
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # 5. بناء التطبيق وتوليد الـ APK مباشرة
      - name: Build APK with Global Gradle
        run: |
          # تحديد مكان مجلد المشروع الذي يحتوي على ملف الإعدادات
          PROJECT_DIR="extracted_project/my-apk"
          cd "$PROJECT_DIR"
          
          # استخدام الـ Gradle المثبت عالمياً لبناء نسخة الـ Debug
          gradle assembleDebug

      # 6. استخراج ملف الـ APK الناتج ورفعه للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 'extracted_project/my-apk/app/build/outputs/apk/debug/*.apk'
