name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من مستودع GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. خطوة استكشافية لمعرفة أسماء الملفات والمجلدات الحقيقية في مستودعك
      - name: List Files in Repository
        run: |
          echo "=== الملفات الموجودة في المجلد الرئيسي ==="
          ls -la
          echo "=== بنية المجلدات كاملة ==="
          find . -maxdepth 3 -not -path '*/.*'

      # 3. إعداد بيئة جافا (بدون كاش لتجنب توقف السيرفر)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # تم إيقاف الكاش مؤقتاً لتخطي الخطأ والاستمرار في فحص الملفات

      # 4. إعطاء صلاحية التشغيل لملف gradlew (سنحاول البحث عنه وتشغيله بمرونة)
      - name: Grant Execute Permission for Gradlew
        run: |
          # البحث عن ملف gradlew وإعطائه صلاحية التشغيل أينما كان
          find . -name "gradlew" -exec chmod +x {} \;

      # 5. بناء نسخة الـ APK
      # الكود أدناه سيبحث تلقائياً عن المجلد الذي يحتوي على gradlew ويبني منه مباشرة
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "خطأ: لم يتم العثور على ملف gradlew في المستودع!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "تم العثور على المشروع في: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      # 6. استخراج ملف الـ APK ورفعه كناتج (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk' # سيبحث عن ملف الـ APK أينما تم توليده
