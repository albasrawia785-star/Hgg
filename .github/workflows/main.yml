name: Build Android APK

on:
  push:
    branches:
      - main # أو اسم الفرع الرئيسي لديك (مثلاً master)
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (Java SDK) - نسختي 17 أو 11 هما الأكثر توافقاً مع Gradle الحديث
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. إعطاء صلاحيات التشغيل لملف gradlew
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # 4. بناء ملف الـ APK (نسخة الـ Debug للتجربة)
      # إذا كنت تريد بناء نسخة Release مغلقة وموقعة، ستحتاج لإعداد مفاتيح التوقيع لاحقاً.
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. رفع ملف الـ APK كناتج (Artifact) لتحميله بعد انتهاء العمل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
