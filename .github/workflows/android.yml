name: Universal Bulletproof Android Builder & Military Hardener

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
          
          ZIP_FILE=$(find uploads -type f -name "*${BUILD_ID}*.zip" 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Project zip file not found!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # ⚙️ تخصيص ومطابقة الـ Package Name و Google Services تلقائياً
      - name: Auto-Sync Package Name & Google Services
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          USER_PKG="${{ github.event.client_payload.package_name }}"
          RAW_MIN_SDK="${{ github.event.client_payload.min_sdk }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          VERSION_NAME="${{ github.event.client_payload.version_name }}"

          convert_sdk() {
            case "$1" in
              "7") echo "24" ;; "8") echo "26" ;; "9") echo "28" ;; "10") echo "29" ;;
              "11") echo "30" ;; "12") echo "31" ;; "13") echo "33" ;; "14") echo "34" ;;
              "15") echo "35" ;; "16") echo "36" ;; "17") echo "37" ;; *) echo "$1" ;;
            esac
          }
          MIN_SDK=$(convert_sdk "$RAW_MIN_SDK")

          if [ -n "$APP_NAME" ]; then
            find project_dir -type f -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" {} +
          fi

          if [ -n "$USER_PKG" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(applicationId\s*=\s*)\"[^\"]+\"/\1\"$USER_PKG\"/g" "$g_file"
              sed -i -E "s/(applicationId\s+)\"[^\"]+\"/\1\"$USER_PKG\"/g" "$g_file"
              sed -i -E "s/(applicationId\.set\s*\(\s*)\"[^\"]+\"(\s*\))/\1\"$USER_PKG\"\2/g" "$g_file"
            done
          fi

          cat << 'EOF' > sync_pkg.py
          import os, re, json

          detected_pkg = ""
          for root, _, files in os.walk("project_dir"):
              for file in files:
                  if file in ["build.gradle.kts", "build.gradle"]:
                      with open(os.path.join(root, file), 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      m = re.search(r'applicationId\s*(?:=\s*|\s+)"([^"]+)"', content)
                      if m:
                          detected_pkg = m.group(1)
                          break
              if detected_pkg:
                  break

          if not detected_pkg:
              detected_pkg = "com.aistudio.restaurantpos.vmdjqk"

          print(f"📦 اسم الحزمة الفعلي المعتمد: {detected_pkg}")

          dummy_data = {
              "project_info": {
                  "project_number": "123456789",
                  "project_id": "app-project-universal",
                  "storage_bucket": "app.appspot.com"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                      "android_client_info": {
                          "package_name": detected_pkg
                      }
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "AIzaSyDummyKeyForBuildSuccessPass12345"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }],
              "configuration_version": "1"
          }

          for root, dirs, files in os.walk("project_dir"):
              if os.path.basename(root) == "app" or "src" in dirs:
                  json_path = os.path.join(root, "google-services.json")
                  if os.path.exists(json_path):
                      try:
                          with open(json_path, 'r', encoding='utf-8') as f:
                              d = json.load(f)
                          if "client" in d and len(d["client"]) > 0:
                              for c in d["client"]:
                                  c["client_info"]["android_client_info"]["package_name"] = detected_pkg
                          with open(json_path, 'w', encoding='utf-8') as f:
                              json.dump(d, f, indent=2)
                      except Exception:
                          with open(json_path, 'w', encoding='utf-8') as f:
                              json.dump(dummy_data, f, indent=2)
                  else:
                      with open(json_path, 'w', encoding='utf-8') as f:
                          json.dump(dummy_data, f, indent=2)
          EOF
          python3 sync_pkg.py
          rm sync_pkg.py

          if [ -n "$MIN_SDK" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(minSdk(Version)?\s*=\s*)[0-9]+/\1$MIN_SDK/g" {} +
          fi
          if [ -n "$VERSION_CODE" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$VERSION_CODE/g" {} +
          fi
          if [ -n "$VERSION_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"$VERSION_NAME\"/g" {} +
          fi
        continue-on-error: true

      # 🛡️ محرك التشفير الآمن والتحصين الشامل
      - name: Precise & Bulletproof Code Obfuscation
        run: |
          echo "================================================================="
          echo "🛡️ تفعيل التشفير الذكي والدقيق للبيانات الحساسة والأسرار..."
          echo "================================================================="

          cat << 'EOF' > smart_hardener.py
          import os
          import re
          import random

          def encode_to_vault(text, salt):
              encoded = text.encode('utf-8')
              encrypted = [f"{b ^ salt}.toByte()" for b in encoded]
              return ", ".join(encrypted)

          secured_count = 0

          # 1. تحصين المانيفست
          for root, _, files in os.walk("project_dir"):
              for file in files:
                  if file == "AndroidManifest.xml":
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          m = f.read()
                      m = m.replace('android:allowBackup="true"', 'android:allowBackup="false"')
                      m = m.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
                      m = re.sub(r'android:debuggable="true"', '', m)
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(m)

          # 2. حقن كائن التشفير والحماية الذاتية SecurityVault
          vault_code = """package com.example.utils

          import android.os.Process
          import java.io.BufferedReader
          import java.io.FileReader

          object SecurityVault {

              init {
                  checkDebugger()
              }

              @JvmStatic
              fun d(bytes: ByteArray, k: Int): String {
                  val res = ByteArray(bytes.size)
                  for (i in bytes.indices) {
                      res[i] = (bytes[i].toInt() xor k).toByte()
                  }
                  return String(res, Charsets.UTF_8)
              }

              private fun checkDebugger() {
                  try {
                      val reader = BufferedReader(FileReader("/proc/self/status"))
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          if (line!!.startsWith("TracerPid:")) {
                              val pid = line!!.substring(10).trim().toInt()
                              if (pid != 0) {
                                  reader.close()
                                  Process.killProcess(Process.myPid())
                                  System.exit(0)
                              }
                          }
                      }
                      reader.close()
                  } catch (ignored: Exception) {}
              }
          }
          """
          for root, dirs, files in os.walk("project_dir"):
              if root.endswith(os.path.join("src", "main", "java", "com", "example", "utils")):
                  with open(os.path.join(root, "SecurityVault.kt"), "w", encoding="utf-8") as vf:
                      vf.write(vault_code)
                  break

          # 3. نمط لاستهداف المتغيرات الحساسة الصريحة
          secret_var_pattern = r'(const\s+val|val|var)\s+([a-zA-Z0-9_]*(?:PASSWORD|PASSWD|PASS|SECRET|TOKEN|API_KEY|KEY|ADMIN|AUTH|PHONE|USERNAME|USER|CREDENTIAL|PIN|RESTAURANT)[a-zA-Z0-9_]*)\s*(?::\s*String)?\s*=\s*"([^"$\r\n\\]+)"'

          for root, dirs, files in os.walk("project_dir"):
              dirs[:] = [d for d in dirs if d not in ['.git', 'build', 'node_modules', '.gradle']]
              for file in files:
                  if file.endswith('.kt') and not file.endswith('SecurityVault.kt'):
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      if any(k in content for k in ["@Entity", "@Dao", "@Database", "androidx.room"]):
                          continue

                      modified = False

                      def replacer(m):
                          global secured_count, modified
                          decl = m.group(1)
                          var_name = m.group(2)
                          val_str = m.group(3)

                          if val_str in ["", " "]:
                              return m.group(0)

                          salt = random.randint(110, 245)
                          b_str = encode_to_vault(val_str, salt)
                          secured_count += 1
                          modified = True

                          target_decl = "var" if "var" in decl else "val"
                          return f"{target_decl} {var_name}: String = com.example.utils.SecurityVault.d(byteArrayOf({b_str}), {salt})"

                      new_content = re.sub(secret_var_pattern, replacer, content)

                      if modified:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(new_content)

          # 4. قواعد R8 الشاملة والمتوافقة 100%
          r8_rules = """
          -keep class com.example.utils.SecurityVault { *; }
          -repackageclasses ''
          -allowaccessmodification
          -dontwarn **
          -dontwarn androidx.room.**
          -keepclassmembers class * extends androidx.room.RoomDatabase { *; }
          -keep class * extends androidx.room.RoomDatabase
          -keep @androidx.room.Entity class * { *; }
          -keep @androidx.room.Dao class * { *; }
          -keep class androidx.compose.** { *; }
          -keep class androidx.activity.** { *; }
          -keep class androidx.fragment.app.** { *; }
          -assumenosideeffects class android.util.Log {
              public static boolean isLoggable(java.lang.String, int);
              public static int v(...);
              public static int d(...);
              public static int i(...);
              public static int w(...);
              public static int e(...);
          }
          """
          for root, dirs, files in os.walk("project_dir"):
              if os.path.basename(root) == "app":
                  p_file = os.path.join(root, "proguard-rules.pro")
                  with open(p_file, "a", encoding="utf-8") as f:
                      f.write(r8_rules)

          print(f"🔒 تم تشفير {secured_count} حقل حساس صريح بنجاح.")
          EOF

          python3 smart_hardener.py
          rm smart_hardener.py

          # تفعيل التقليص في build.gradle
          find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
            sed -i -E "s/(isMinifyEnabled\s*=\s*)false/\1true/g" "$g_file"
            sed -i -E "s/(minifyEnabled\s+)false/\1true/g" "$g_file"
            sed -i -E "s/(isShrinkResources\s*=\s*)false/\1true/g" "$g_file"
            sed -i -E "s/(shrinkResources\s+)false/\1true/g" "$g_file"
          done

      - name: Setup Gradle 9.3.1
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x ./gradlew
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        continue-on-error: true

      - name: Replace Custom App Icon Cleanly
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find uploads -type f -name "*${BUILD_ID}*.png" 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            find project_dir -type d -name "*anydpi*" -exec rm -rf {} +
            find project_dir -type d \( -name "mipmap-*" -o -name "drawable-*" \) | while read -r res_dir; do
              rm -f "$res_dir"/ic_launcher*.xml "$res_dir"/ic_launcher*.webp "$res_dir"/ic_launcher*.png
              cp -f "$ICON_FILE" "$res_dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_round.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_foreground.png"
            done
          fi
        continue-on-error: true

      # ⚙️ تجميع الـ APK وتوقيعه إجبارياً باستخدام apksigner الرسمي (V1 + V2 + V3)
      - name: Build & Guaranteed Apksigner (V1, V2, V3 Signing)
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          # 🔑 1. توليد مفتاح التوقيع
          keytool -genkey -v -keystore universal.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Secure, O=Android, C=US" || true

          # 🔑 2. إيقاف أخطاء الـ Lint
          cat << 'EOF' > fix_signing.py
          import os, re

          for root, _, files in os.walk("."):
              for file in files:
                  if file in ["build.gradle", "build.gradle.kts"]:
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          c = f.read()

                      c = re.sub(r'checkReleaseBuilds\s*=\s*true', 'checkReleaseBuilds = false', c)
                      c = re.sub(r'checkReleaseBuilds\s+true', 'checkReleaseBuilds false', c)
                      c = re.sub(r'abortOnError\s*=\s*true', 'abortOnError = false', c)
                      c = re.sub(r'abortOnError\s+true', 'abortOnError false', c)

                      with open(p, "w", encoding="utf-8") as f:
                          f.write(c)
          EOF
          python3 fix_signing.py
          rm fix_signing.py

          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi

          # 🔑 3. تنفيذ التجميع
          if [ "$BUILD_TYPE" == "aab" ]; then
            ./gradlew clean bundleRelease -x lintVitalRelease -x lint --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.aab"
            cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          else
            ./gradlew clean assembleRelease -x lintVitalRelease -x lint --no-daemon
            RAW_APK=$(find . -path "*/build/outputs/apk/*/*.apk" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.apk"
            
            # تحديد أدوات Android SDK الرسمية للتوقيع والمحاذاة
            BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            
            # محاذاة وتوقيع الـ APK بـ V1 و V2 و V3 رسمياً
            if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
              echo "✍️ توقيع الحزمة رسمياً عبر apksigner (V1, V2, V3)..."
              "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_NAME" || cp "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
              "$BUILD_TOOLS_DIR/apksigner" sign --ks universal.keystore --ks-key-alias androidkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$GITHUB_WORKSPACE/$FINAL_NAME"
              "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$GITHUB_WORKSPACE/$FINAL_NAME" || true
            else
              cp "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
            fi
          fi

          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV

      - name: Extract Exact Failure Cause
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ [ROOT CAUSE] السبب الدقيق لفشل البناء:"
          echo "=========================================="
          find . -name "*.log" -exec grep -Hn -E "\* What went wrong:|Execution failed for task|Compilation error" {} + 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: |
            ${{ env.FINAL_ASSET }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # خطوة تنظيف المستودع الفورية للحفاظ على النظافة التامة
      - name: Force Clean Uploads Content Cleanly
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git reset --hard origin/HEAD 2>/dev/null || true
          if [ -d "uploads" ]; then find uploads -type f -not -name ".gitkeep" -exec git rm -f {} + 2>/dev/null || true; fi
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.png" \) -exec git rm -f {} + 2>/dev/null || true
          mkdir -p uploads && touch uploads/.gitkeep && git add uploads/.gitkeep 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-clean uploads [skip ci]"
            git push origin HEAD
          fi
