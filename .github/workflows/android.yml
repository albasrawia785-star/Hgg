name: Universal Android Builder

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط ملف المشروع المرفوع
      - name: Unzip project files
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن ملف المشروع المضغوط..."
          
          ZIP_FILE=$(find . -maxdepth 2 -name "*${BUILD_ID}*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على أي ملف zip داخل المستودع!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. بناء التطبيق وضبط توافق Compose مع Gradle
      - name: Build App & Generate Package
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true -Xmx4g"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          TARGET_DIR=$(find project_dir \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find project_dir -name "build.gradle*" -exec dirname {} \; | head -n 1)
          fi
          
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات مشروع أندرويد!"
            exit 1
          fi

          cd "$TARGET_DIR"

          echo "🛠️ 1. إعداد Gradle Wrapper متوافق..."
          # تحديد الإصدار صراحة لمنع الترقية التلقائية إلى Gradle 9.7
          gradle wrapper --gradle-version 8.8 --distribution-type bin || true
          chmod +x gradlew

          echo "⚙️ 2. حقن خصائص التوافق لـ Kotlin و Compose..."
          # تعطيل تجربة K2 وحظر التضارب في Compose
          echo "kotlin.experimental.tryK2=false" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "suppressKotlinVersionCompatibilityCheck=true" >> gradle.properties

          echo "🔑 3. إنشاء ملف debug.keystore للتوثيق..."
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true
          
          if [ -d "app" ]; then cp -f debug.keystore app/debug.keystore || true; fi

          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          if [ -z "$BUILD_ID" ]; then BUILD_ID="latest"; fi

          if [ "$BUILD_TYPE" == "aab" ]; then
            echo "🚀 4. تنفيذ بناء حزمة AAB..."
            ./gradlew clean bundleRelease --no-daemon || ./gradlew clean bundleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="app-release-${BUILD_ID}.aab"
          else
            echo "🚀 4. تنفيذ بناء نسخة Debug APK..."
            ./gradlew clean assembleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)
            FINAL_NAME="app-debug-${BUILD_ID}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "❌ فشل العثور على ملف التطبيق الناتج!"
            exit 1
          fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV
          echo "FINAL_FILENAME=$FINAL_NAME" >> $GITHUB_ENV

          echo "🔑 5. استخراج بصمة SHA-1..."
          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|SHA1:" || true
          echo "✅ تم البناء بنجاح!"

      # 5. نشر الملف في Releases لتسهيل التنزيل المباشر
      - name: Publish Release for Web Download
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'repository_dispatch'
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "${{ env.FINAL_ASSET }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. حفظ نسخة احتياطية في Artifacts
      - name: Upload Build Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_FILENAME }}
          path: ${{ env.FINAL_ASSET }}
