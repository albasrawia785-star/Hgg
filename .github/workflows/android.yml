name: Universal Bulletproof Android Builder

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط المشروع واستخراج الملف المرفوع
      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 2 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            fi

            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "⏳ محاولة ($i/10): انتظار ظهور الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على ملف المشروع المضغوط!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. الإصلاح الجذري الشامل لـ Compose Compiler ومشاكل Gradle
      - name: Fix Compose & Gradle Compatibility
        run: |
          cd project_dir

          # إزالة إعدادات Compose القديمة المتعارضة
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i '/androidx.compose.compiler:compiler/d' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i '/suppressKotlinVersionCompatibilityCheck/d' {} +

          # تفعيل إضافة Compose الرسمية المتوافقة مع Kotlin الحديثة
          find . -type f -name "build.gradle.kts" -path "*/app/*" -exec sed -i '1s/^/plugins { id("org.jetbrains.kotlin.plugin.compose") }\n/' {} +
          find . -type f -name "build.gradle" -path "*/app/*" -not -name "*.kts" -exec sed -i '1s/^/plugins { id "org.jetbrains.kotlin.plugin.compose" }\n/' {} +

          # إعدادات الاستقرار ومنع تعارضات الذاكرة
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "kotlin.mpp.stability.nowarn=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        continue-on-error: true

      # 5. بناء التطبيق والتوقيع المؤقت (APK / AAB)
      - name: Execute Gradle Build
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          # إنشاء مفتاح توقيع مؤقت
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true
          if [ -d "app" ]; then cp -f debug.keystore app/debug.keystore || true; fi

          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          BUILD_ID="${{ github.event.client_payload.build_id }}"

          if [ "$BUILD_TYPE" == "aab" ]; then
            echo "🚀 بدء بناء حزمة AAB..."
            gradle clean bundleRelease --no-daemon || gradle clean bundleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="app-release-${BUILD_ID}.aab"
          else
            echo "🚀 بدء بناء حزمة APK..."
            gradle clean assembleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)
            FINAL_NAME="app-debug-${BUILD_ID}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "❌ فشل العثور على الملف الناتج!"
            exit 1
          fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV

      # 6. نشر التطبيق في Release جديد محدد برقم البناء
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "${{ env.FINAL_ASSET }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. الحذف الذكي عبر GitHub REST API (بدون تعارض وبدون حظر)
      - name: Smart API Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          echo "🧹 جاري حذف الملفات المرفوعة عبر API النظيف..."
          
          # استخراج وحذف ملفات الـ ZIP التابعة للبناء الحالي
          for file in $(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" -o -name "*${BUILD_ID}*.png" | sed 's|^\./||'); do
            echo "🗑️ جاري حذف: $file"
            SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/$file" | jq -r '.sha')
            
            if [ "$SHA" != "null" ] && [ -n "$SHA" ]; then
              curl -s -X DELETE \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d "{\"message\": \"Auto-clean: delete $file\", \"sha\": \"$SHA\"}" \
                "https://api.github.com/repos/$REPO/contents/$file" > /dev/null
              echo "✅ تم حذف $file بنجاح."
            fi
          done
