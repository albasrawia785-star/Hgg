name: Universal Bulletproof Android Builder & Security Engine

on:
  repository_dispatch:
    types: [scan_project, build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 🕵️‍♂️ المرحلة الأولى: الفحص الأمني والتحليل الدقيق
  # =========================================================================
  scan:
    if: github.event.action == 'scan_project'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ZIP_FILE=$(find uploads -type f -name "*${BUILD_ID}*.zip" 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi
          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      - name: Deep Security Analysis Engine
        run: |
          cat << 'EOF' > scanner.py
          import os, re, json

          report = {
              "build_id": "${{ github.event.client_payload.build_id }}",
              "issues_count": 0,
              "findings": []
          }

          secret_signatures = [
              (r'(const\s+val|val|var)\s+([a-zA-Z0-9_]*(?:password|passwd|pass|admin_pass|secret_key|api_secret|db_password)[a-zA-Z0-9_]*)\s*=\s*"([^"]{4,})"', "كلمة مرور أو مفتاح مصادقة صريح"),
              (r'(AIzaSy[0-9A-Za-z-_]{33})', "مفتاح Firebase API مكشوف"),
              (r'(ghp_[0-9a-zA-Z]{36})', "رمز وصول شخصي لـ GitHub مسرب")
          ]

          # 1. تدقيق AndroidManifest
          for root, _, files in os.walk("project_dir"):
              for file in files:
                  if file == "AndroidManifest.xml":
                      with open(os.path.join(root, file), 'r', encoding='utf-8', errors='ignore') as f:
                          m = f.read()
                      if 'android:allowBackup="true"' in m:
                          report["findings"].append({
                              "type": "high",
                              "title": "ثغرة allowBackup=true تتيح سحب قواعد البيانات والبيانات الحساسة عبر ADB",
                              "file": "AndroidManifest.xml"
                          })
                          report["issues_count"] += 1
                      if 'android:usesCleartextTraffic="true"' in m:
                          report["findings"].append({
                              "type": "critical",
                              "title": "تفعيل usesCleartextTraffic يسمح بالتنصت على بيانات الاتصال (HTTP غير مشفر)",
                              "file": "AndroidManifest.xml"
                          })
                          report["issues_count"] += 1

          # 2. تدقيق الكود المصدري (Kotlin / Java)
          for root, dirs, files in os.walk("project_dir"):
              dirs[:] = [d for d in dirs if d not in ['.git', 'build', 'node_modules', '.gradle']]
              for file in files:
                  if file.endswith(('.kt', '.java')):
                      with open(os.path.join(root, file), 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      for pattern, desc in secret_signatures:
                          for match in re.finditer(pattern, content, re.IGNORECASE):
                              report["findings"].append({
                                  "type": "critical",
                                  "title": desc,
                                  "file": file
                              })
                              report["issues_count"] += 1

          with open("security_report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          EOF
          python3 scanner.py

      - name: Publish Security Audit Report
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "scan-${{ github.event.client_payload.build_id }}"
          name: "Security Scan ${{ github.event.client_payload.build_id }}"
          files: "security_report.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # ⚙️ المرحلة الثانية: بناء الـ APK وتطبيق التحصين
  # =========================================================================
  build:
    if: github.event.action != 'scan_project'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
          
          ZIP_FILE=$(find uploads -type f -name "*${BUILD_ID}*.zip" 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi
          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      - name: Customize App Configurations
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          ENABLE_MINIFY="${{ github.event.client_payload.enable_minify }}"
          RAW_MIN_SDK="${{ github.event.client_payload.min_sdk }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          VERSION_NAME="${{ github.event.client_payload.version_name }}"

          convert_sdk() {
            case "$1" in
              "7") echo "24" ;; "8") echo "26" ;; "9") echo "28" ;; "10") echo "29" ;;
              "11") echo "30" ;; "12") echo "31" ;; "13") echo "33" ;; "14") echo "34" ;;
              "15") echo "35" ;; "16") echo "36" ;; "17") echo "37" ;; *) echo "$1" ;;
            esac
          }
          MIN_SDK=$(convert_sdk "$RAW_MIN_SDK")

          if [ -n "$APP_NAME" ]; then
            find project_dir -type f -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" {} +
          fi

          if [ -n "$PACKAGE_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(applicationId\s*=\s*)\"[^\"]+\"/\1\"$PACKAGE_NAME\"/g" "$g_file"
              sed -i -E "s/(applicationId\s+)\"[^\"]+\"/\1\"$PACKAGE_NAME\"/g" "$g_file"
              sed -i -E "s/(applicationId\.set\s*\(\s*)\"[^\"]+\"(\s*\))/\1\"$PACKAGE_NAME\"\2/g" "$g_file"
            done
            find project_dir -type f -name "google-services.json" | while read -r json_file; do
              sed -i -E "s/\"package_name\":\s*\"[^\"]+\"/\"package_name\": \"$PACKAGE_NAME\"/g" "$json_file"
            done
          fi

          if [ "$ENABLE_MINIFY" == "true" ]; then
            find project_dir -type d -name "app" | while read -r app_mod; do
              printf -- "-repackageclasses ''\n-allowaccessmodification\n-dontwarn **\n-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod\n-keep class androidx.activity.** { *; }\n-keep class androidx.fragment.app.** { *; }\n-keep public class * extends android.app.Activity\n-keep public class * extends android.app.Application\n-keep public class * extends android.app.Service\n-keep public class * extends android.content.BroadcastReceiver\n-keepclassmembers enum * { *; }\n" >> "$app_mod/proguard-rules.pro"
            done
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(isMinifyEnabled\s*=\s*)false/\1true/g" "$g_file"
              sed -i -E "s/(minifyEnabled\s+)false/\1true/g" "$g_file"
              sed -i -E "s/(isShrinkResources\s*=\s*)false/\1true/g" "$g_file"
              sed -i -E "s/(shrinkResources\s+)false/\1true/g" "$g_file"
            done
          fi

          if [ -n "$MIN_SDK" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(minSdk(Version)?\s*=\s*)[0-9]+/\1$MIN_SDK/g" {} +
          fi
          if [ -n "$VERSION_CODE" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$VERSION_CODE/g" {} +
          fi
          if [ -n "$VERSION_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"$VERSION_NAME\"/g" {} +
          fi
        continue-on-error: true

      - name: Apply Auto-Fix & XOR Obfuscation (If Approved)
        run: |
          AUTO_FIX="${{ github.event.client_payload.auto_fix }}"
          if [ "$AUTO_FIX" == "true" ]; then
            echo "🛡️ تطبيق الإصلاح والتشفير التلقائي للأكواد..."
            cat << 'EOF' > fix.py
            import os, re, random

            def xor_obfuscate(text):
                k = random.randint(110, 245)
                b = [str(ord(c) ^ k) for c in text]
                return f"String(byteArrayOf({', '.join(b)}).map {{ (it.toInt() xor {k}).toByte() }}.toByteArray())"

            # 1. إصلاح AndroidManifest
            for root, _, files in os.walk("project_dir"):
                for file in files:
                    if file == "AndroidManifest.xml":
                        p = os.path.join(root, file)
                        with open(p, "r", encoding="utf-8") as f:
                            c = f.read().replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"').replace('android:allowBackup="true"', 'android:allowBackup="false"')
                        with open(p, "w", encoding="utf-8") as f:
                            f.write(c)

            # 2. تشفير الكود وتحويل const val إلى val لمنع أخطاء التجميع
            pattern = r'(const\s+val|val|var)\s+([a-zA-Z0-9_]*(?:password|passwd|pass|admin_pass|secret_key|api_secret|db_password)[a-zA-Z0-9_]*)\s*=\s*"([^"]{4,})"'
            for root, dirs, files in os.walk("project_dir"):
                dirs[:] = [d for d in dirs if d not in ['.git', 'build', 'node_modules', '.gradle']]
                for file in files:
                    if file.endswith(('.kt', '.java')):
                        p = os.path.join(root, file)
                        with open(p, "r", encoding="utf-8", errors="ignore") as f:
                            c = f.read()
                        new_c = re.sub(pattern, lambda m: f"val {m.group(2)} = {xor_obfuscate(m.group(3))}", c)
                        if new_c != c:
                            with open(p, "w", encoding="utf-8") as f:
                                f.write(new_c)
            EOF
            python3 fix.py
            rm fix.py
          fi
        continue-on-error: true

      - name: Setup Gradle 9.3.1
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x ./gradlew
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        continue-on-error: true

      - name: Replace Custom App Icon Cleanly
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find uploads -type f -name "*${BUILD_ID}*.png" 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            find project_dir -type d -name "*anydpi*" -exec rm -rf {} +
            find project_dir -type d \( -name "mipmap-*" -o -name "drawable-*" \) | while read -r res_dir; do
              rm -f "$res_dir"/ic_launcher*.xml "$res_dir"/ic_launcher*.webp "$res_dir"/ic_launcher*.png
              cp -f "$ICON_FILE" "$res_dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_round.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_foreground.png"
            done
          fi
        continue-on-error: true

      - name: Execute Gradle Build
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true
          if [ -d "app" ]; then cp -f debug.keystore app/debug.keystore || true; fi

          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          ENABLE_MINIFY="${{ github.event.client_payload.enable_minify }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi

          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' {} +
          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' {} +

          if [ "$BUILD_TYPE" == "aab" ]; then
            ./gradlew clean bundleRelease --no-daemon || ./gradlew clean bundleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.aab"
          else
            if [ "$ENABLE_MINIFY" == "true" ]; then
              ./gradlew clean assembleRelease --no-daemon || ./gradlew clean assembleDebug --no-daemon
            else
              ./gradlew clean assembleDebug --no-daemon
            fi
            OUT_FILE=$(find . -path "*/build/outputs/apk/*/*.apk" -not -name "*unaligned*" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then exit 1; fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV
          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|Variant: release|SHA1:" || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "${{ env.FINAL_ASSET }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Clean Uploads Content Cleanly
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git reset --hard origin/HEAD 2>/dev/null || true
          if [ -d "uploads" ]; then find uploads -type f -not -name ".gitkeep" -exec git rm -f {} + 2>/dev/null || true; fi
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.png" \) -exec git rm -f {} + 2>/dev/null || true
          mkdir -p uploads && touch uploads/.gitkeep && git add uploads/.gitkeep 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-clean uploads [skip ci]"
            git push origin HEAD
          fi
