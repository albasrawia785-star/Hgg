name: Universal Bulletproof Android Builder

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
          echo "Looking for project zip with Build ID: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 2 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            fi

            if [ -n "$ZIP_FILE" ]; then
              echo "Found file: $ZIP_FILE"
              break
            fi
            echo "Waiting for file ($i/10)..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Project zip file not found!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      - name: Customize App Configurations
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          ENABLE_MINIFY="${{ github.event.client_payload.enable_minify }}"
          RAW_MIN_SDK="${{ github.event.client_payload.min_sdk }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          VERSION_NAME="${{ github.event.client_payload.version_name }}"

          convert_sdk() {
            case "$1" in
              "7") echo "24" ;;
              "8") echo "26" ;;
              "9") echo "28" ;;
              "10") echo "29" ;;
              "11") echo "30" ;;
              "12") echo "31" ;;
              "13") echo "33" ;;
              "14") echo "34" ;;
              "15") echo "35" ;;
              "16") echo "36" ;;
              "17") echo "37" ;;
              *) echo "$1" ;;
            esac
          }

          MIN_SDK=$(convert_sdk "$RAW_MIN_SDK")

          if [ -n "$APP_NAME" ]; then
            find project_dir -type f -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" {} +
          fi

          # تعديل معرف الحزمة وتحديث google-services.json تلقائياً
          if [ -n "$PACKAGE_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(applicationId\s*=\s*)\"[^\"]+\"/\1\"$PACKAGE_NAME\"/g" "$g_file"
              sed -i -E "s/(applicationId\s+)\"[^\"]+\"/\1\"$PACKAGE_NAME\"/g" "$g_file"
              sed -i -E "s/(applicationId\.set\s*\(\s*)\"[^\"]+\"(\s*\))/\1\"$PACKAGE_NAME\"\2/g" "$g_file"
            done

            find project_dir -type f -name "google-services.json" | while read -r json_file; do
              sed -i -E "s/\"package_name\":\s*\"[^\"]+\"/\"package_name\": \"$PACKAGE_NAME\"/g" "$json_file"
            done
          fi

          # إعداد قواعد التشفير R8
          if [ "$ENABLE_MINIFY" == "true" ]; then
            find project_dir -type d -name "app" | while read -r app_mod; do
              printf -- "-repackageclasses ''\n-allowaccessmodification\n-dontwarn **\n-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod\n-keep class androidx.activity.** { *; }\n-keep class androidx.fragment.app.** { *; }\n-keep public class * extends android.app.Activity\n-keep public class * extends android.app.Application\n-keep public class * extends android.app.Service\n-keep public class * extends android.content.BroadcastReceiver\n-keepclassmembers enum * { *; }\n" >> "$app_mod/proguard-rules.pro"
            done

            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(isMinifyEnabled\s*=\s*)false/\1true/g" "$g_file"
              sed -i -E "s/(minifyEnabled\s+)false/\1true/g" "$g_file"
              sed -i -E "s/(isShrinkResources\s*=\s*)false/\1true/g" "$g_file"
              sed -i -E "s/(shrinkResources\s+)false/\1true/g" "$g_file"
            done
          fi

          if [ -n "$MIN_SDK" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(minSdk(Version)?\s*=\s*)[0-9]+/\1$MIN_SDK/g" "$g_file"
              sed -i -E "s/(minSdk(Version)?\s+)[0-9]+/\1$MIN_SDK/g" "$g_file"
              sed -i -E "s/(minSdk\s*\(\s*)[0-9]+(\s*\))/\1$MIN_SDK\2/g" "$g_file"
              sed -i -E "s/(minSdk\.set\s*\(\s*)[0-9]+(\s*\))/\1$MIN_SDK\2/g" "$g_file"
            done
          fi

          if [ -n "$VERSION_CODE" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$VERSION_CODE/g" "$g_file"
              sed -i -E "s/(versionCode\s+)[0-9]+/\1$VERSION_CODE/g" "$g_file"
              sed -i -E "s/(versionCode\.set\s*\(\s*)[0-9]+(\s*\))/\1$VERSION_CODE\2/g" "$g_file"
            done
          fi

          if [ -n "$VERSION_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"$VERSION_NAME\"/g" "$g_file"
              sed -i -E "s/(versionName\s+)\"[^\"]+\"/\1\"$VERSION_NAME\"/g" "$g_file"
              sed -i -E "s/(versionName\.set\s*\(\s*)\"[^\"]+\"(\s*\))/\1\"$VERSION_NAME\"\2/g" "$g_file"
            done
          fi
        continue-on-error: true

      - name: Setup Gradle 9.3.1
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x ./gradlew

          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        continue-on-error: true

      - name: Replace Custom App Icon Cleanly
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find . -maxdepth 2 -name "*${BUILD_ID}*.png" | head -n 1)
          if [ -z "$ICON_FILE" ]; then
            ICON_FILE=$(find . -maxdepth 1 -name "*.png" | head -n 1)
          fi

          if [ -n "$ICON_FILE" ]; then
            find project_dir -type d -name "*anydpi*" -exec rm -rf {} +
            find project_dir -type d \( -name "mipmap-*" -o -name "drawable-*" \) | while read -r res_dir; do
              rm -f "$res_dir"/ic_launcher*.xml
              rm -f "$res_dir"/ic_launcher*.webp
              rm -f "$res_dir"/ic_launcher*.png
              
              cp -f "$ICON_FILE" "$res_dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_round.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_foreground.png"
            done
          fi
        continue-on-error: true

      - name: Execute Gradle Build
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true
          if [ -d "app" ]; then cp -f debug.keystore app/debug.keystore || true; fi

          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          ENABLE_MINIFY="${{ github.event.client_payload.enable_minify }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi

          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' {} +
          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' {} +

          if [ "$BUILD_TYPE" == "aab" ]; then
            ./gradlew clean bundleRelease --no-daemon || ./gradlew clean bundleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.aab"
          else
            if [ "$ENABLE_MINIFY" == "true" ]; then
              ./gradlew clean assembleRelease --no-daemon || ./gradlew clean assembleDebug --no-daemon
            else
              ./gradlew clean assembleDebug --no-daemon
            fi
            OUT_FILE=$(find . -path "*/build/outputs/apk/*/*.apk" -not -name "*unaligned*" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "Error: Output file not found!"
            exit 1
          fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV

          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|Variant: release|SHA1:" || true

      # خطوة استخراج السبب الحقيقي للخطأ عند الفشل لسهولة تشخيصه
      - name: Extract Exact Failure Cause
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ [ROOT CAUSE] السبب الدقيق لفشل البناء:"
          echo "=========================================="
          find . -name "*.log" -exec grep -Hn -E "\* What went wrong:|Execution failed for task|Compilation error" {} + 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "${{ env.FINAL_ASSET }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # خطوة الحذف الجذري والتنظيف الشامل للمستودع
      - name: Force Clean Uploaded Archives
        if: always()
        run: |
          echo "🧹 جاري الحذف الجذري لكافة الملفات المضغوطة والأيقونات المؤقتة..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git reset --hard origin/HEAD 2>/dev/null || true
          
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.png" \) -exec git rm -f {} + 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-clean: remove all uploaded archives [skip ci]"
            git push origin HEAD
            echo "✅ تم حذف كافة الملفات وتنظيف المستودع بنجاح!"
          else
            echo "ℹ️ المستودع نظيف بالفعل."
          fi
