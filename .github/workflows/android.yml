name: Universal Bulletproof Android Builder & Military Hardener

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
          
          ZIP_FILE=$(find uploads -type f -name "*${BUILD_ID}*.zip" 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Project zip file not found!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      - name: Customize App Configurations
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          RAW_MIN_SDK="${{ github.event.client_payload.min_sdk }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          VERSION_NAME="${{ github.event.client_payload.version_name }}"

          convert_sdk() {
            case "$1" in
              "7") echo "24" ;; "8") echo "26" ;; "9") echo "28" ;; "10") echo "29" ;;
              "11") echo "30" ;; "12") echo "31" ;; "13") echo "33" ;; "14") echo "34" ;;
              "15") echo "35" ;; "16") echo "36" ;; "17") echo "37" ;; *) echo "$1" ;;
            esac
          }
          MIN_SDK=$(convert_sdk "$RAW_MIN_SDK")

          if [ -n "$APP_NAME" ]; then
            find project_dir -type f -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" {} +
          fi

          if [ -n "$PACKAGE_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(applicationId\s*=\s*)\"[^\"]+\"/\1\"$PACKAGE_NAME\"/g" "$g_file"
              sed -i -E "s/(applicationId\s+)\"[^\"]+\"/\1\"$PACKAGE_NAME\"/g" "$g_file"
              sed -i -E "s/(applicationId\.set\s*\(\s*)\"[^\"]+\"(\s*\))/\1\"$PACKAGE_NAME\"\2/g" "$g_file"
            done
            find project_dir -type f -name "google-services.json" | while read -r json_file; do
              sed -i -E "s/\"package_name\":\s*\"[^\"]+\"/\"package_name\": \"$PACKAGE_NAME\"/g" "$json_file"
            done
          fi

          if [ -n "$MIN_SDK" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(minSdk(Version)?\s*=\s*)[0-9]+/\1$MIN_SDK/g" {} +
          fi
          if [ -n "$VERSION_CODE" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$VERSION_CODE/g" {} +
          fi
          if [ -n "$VERSION_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"$VERSION_NAME\"/g" {} +
          fi
        continue-on-error: true

      # 🛡️ محرك التشفير الشامل لكل النصوص والنصوص الثابتة بدون استثناء
      - name: Master Cyber Threat Auto-Remediation & Universal String Obfuscation
        run: |
          AUTO_FIX="${{ github.event.client_payload.auto_fix }}"
          if [ -z "$AUTO_FIX" ]; then AUTO_FIX="true"; fi

          if [ "$AUTO_FIX" == "true" ]; then
            echo "================================================================="
            echo "🛡️ تفعيل التشفير الثنائي الشامل وإخفاء كافة النصوص الصريحة..."
            echo "================================================================="

            cat << 'EOF' > master_hardener.py
            import os
            import sys
            import re
            import random

            def polymorphic_xor(text):
                salt = random.randint(110, 245)
                encoded_bytes = text.encode('utf-8')
                encrypted = [str(b ^ salt) for b in encoded_bytes]
                return f"String(byteArrayOf({', '.join(encrypted)}).map {{ (it.toInt() xor {salt}).toByte() }}.toByteArray(), Charsets.UTF_8)"

            secured_count = 0

            # 1. تحصين المانيفست
            for root, _, files in os.walk("project_dir"):
                for file in files:
                    if file == "AndroidManifest.xml":
                        p = os.path.join(root, file)
                        with open(p, "r", encoding="utf-8", errors="ignore") as f:
                            m = f.read()
                        m = m.replace('android:allowBackup="true"', 'android:allowBackup="false"')
                        m = m.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
                        m = re.sub(r'android:debuggable="true"', '', m)
                        with open(p, "w", encoding="utf-8") as f:
                            f.write(m)

            # 2. تشفير كافة متغيرات النصوص وحذف const لمنع بقائها في الـ DEX Pool
            string_var_pattern = r'(const\s+val|val|var)\s+([a-zA-Z0-9_]+)\s*(?::\s*String)?\s*=\s*"([^"\\]*(?:\\.[^"\\]*)*)"'

            for root, dirs, files in os.walk("project_dir"):
                dirs[:] = [d for d in dirs if d not in ['.git', 'build', 'node_modules', '.gradle']]
                for file in files:
                    if file.endswith(('.kt', '.java')):
                        p = os.path.join(root, file)
                        with open(p, "r", encoding="utf-8", errors="ignore") as f:
                            content = f.read()

                        modified = False

                        def replace_string_var(match):
                            nonlocal modified, secured_count
                            var_name = match.group(2)
                            str_val = match.group(3)
                            
                            if str_val in ["", " "]:
                                return match.group(0)
                            
                            modified = True
                            secured_count += 1
                            return f"val {var_name} = {polymorphic_xor(str_val)}"

                        new_content = re.sub(string_var_pattern, replace_string_var, content)

                        new_content = new_content.replace("setAllowFileAccess(true)", "setAllowFileAccess(false)")
                        new_content = new_content.replace("setAllowFileAccessFromFileURLs(true)", "setAllowFileAccessFromFileURLs(false)")

                        if modified or new_content != content:
                            with open(p, "w", encoding="utf-8") as f:
                                f.write(new_content)

            # 3. إعداد قواعد R8 القوية مع مسح أسماء الدوال والكلاسات وإزالة الـ Logs
            r8_aggressive_rules = """
            -repackageclasses ''
            -allowaccessmodification
            -dontwarn **
            -overloadaggressively
            -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
            -keep class androidx.activity.** { *; }
            -keep class androidx.fragment.app.** { *; }
            -keep public class * extends android.app.Activity
            -keep public class * extends android.app.Application
            -keep public class * extends android.app.Service
            -keep public class * extends android.content.BroadcastReceiver
            -keepclassmembers enum * { *; }
            -assumenosideeffects class android.util.Log {
                public static boolean isLoggable(java.lang.String, int);
                public static int v(...);
                public static int d(...);
                public static int i(...);
                public static int w(...);
                public static int e(...);
            }
            """
            for root, dirs, files in os.walk("project_dir"):
                if os.path.basename(root) == "app":
                    p_file = os.path.join(root, "proguard-rules.pro")
                    with open(p_file, "a", encoding="utf-8") as f:
                        f.write(r8_aggressive_rules)

            print(f"🔒 تم تحويل وتشفير {secured_count} نصاً برمجياً إلى مصفوفات Bytecode مشفرة.")
            print("🛡️ تم حقن درع R8 Aggressive Obfuscation وقفل المانيفست.")
            EOF

            python3 master_hardener.py
            rm master_hardener.py

            # إجبار تفعيل التقليص والـ R8 في الـ Build
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(isMinifyEnabled\s*=\s*)false/\1true/g" "$g_file"
              sed -i -E "s/(minifyEnabled\s+)false/\1true/g" "$g_file"
              sed -i -E "s/(isShrinkResources\s*=\s*)false/\1true/g" "$g_file"
              sed -i -E "s/(shrinkResources\s+)false/\1true/g" "$g_file"
            done
          fi
        continue-on-error: true

      - name: Setup Gradle 9.3.1
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x ./gradlew
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        continue-on-error: true

      - name: Replace Custom App Icon Cleanly
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find uploads -type f -name "*${BUILD_ID}*.png" 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            find project_dir -type d -name "*anydpi*" -exec rm -rf {} +
            find project_dir -type d \( -name "mipmap-*" -o -name "drawable-*" \) | while read -r res_dir; do
              rm -f "$res_dir"/ic_launcher*.xml "$res_dir"/ic_launcher*.webp "$res_dir"/ic_launcher*.png
              cp -f "$ICON_FILE" "$res_dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_round.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_foreground.png"
            done
          fi
        continue-on-error: true

      # ⚙️ تنظيف وحقن إعدادات التوقيع الشاملة وحل خطأ storePassword نهائياً
      - name: Fix Signing Configs & Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          # 🔑 1. توليد مفاتيح التوقيع بكل الصيغ الممكنة
          keytool -genkey -v -keystore universal.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true
          for k_name in "my-upload-key.jks" "release.keystore" "debug.keystore" "upload-keystore.jks" "key.jks" "keystore.jks"; do
            cp -f universal.keystore "$k_name"
            if [ -d "app" ]; then cp -f universal.keystore "app/$k_name"; fi
            find . -type d -name "app" -exec cp -f universal.keystore "{}/$k_name" \; 2>/dev/null || true
          done

          # 🔑 2. إجبار كافة ملفات Gradle على استخدام debug signing config المضمون وتخطي أخطاء Lint
          cat << 'EOF' > fix_signing.py
          import os, re

          for root, _, files in os.walk("."):
              for file in files:
                  if file in ["build.gradle", "build.gradle.kts"]:
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          c = f.read()

                      # استبدال أي طلب لتوقيع release بتوقيع debug المضمون
                      c = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("release"\)', 'signingConfig = signingConfigs.getByName("debug")', c)
                      c = re.sub(r'signingConfig\s+signingConfigs\.release', 'signingConfig signingConfigs.debug', c)
                      c = re.sub(r'signingConfig\s*=\s*signingConfigs\.release', 'signingConfig = signingConfigs.debug', c)

                      # إيقاف توقف البناء عند مشاكل Lint
                      c = re.sub(r'checkReleaseBuilds\s*=\s*true', 'checkReleaseBuilds = false', c)
                      c = re.sub(r'checkReleaseBuilds\s+true', 'checkReleaseBuilds false', c)
                      c = re.sub(r'abortOnError\s*=\s*true', 'abortOnError = false', c)
                      c = re.sub(r'abortOnError\s+true', 'abortOnError false', c)

                      with open(p, "w", encoding="utf-8") as f:
                          f.write(c)
          EOF
          python3 fix_signing.py
          rm fix_signing.py

          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi

          # 🔑 3. تنفيذ التجميع
          if [ "$BUILD_TYPE" == "aab" ]; then
            ./gradlew clean bundleRelease -x lintVitalRelease -x lint --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.aab"
          else
            ./gradlew clean assembleRelease -x lintVitalRelease -x lint --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/apk/*/*.apk" -not -name "*unaligned*" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "Error: Output file not found!"
            exit 1
          fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV

          ./gradlew signingReport --no-daemon | grep -E "Variant: release|Variant: debug|SHA1:" || true

      - name: Extract Exact Failure Cause
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ [ROOT CAUSE] السبب الدقيق لفشل البناء:"
          echo "=========================================="
          find . -name "*.log" -exec grep -Hn -E "\* What went wrong:|Execution failed for task|Compilation error" {} + 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: |
            ${{ env.FINAL_ASSET }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # خطوة تنظيف المستودع الفورية للحفاظ على النظافة التامة
      - name: Force Clean Uploads Content Cleanly
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git reset --hard origin/HEAD 2>/dev/null || true
          if [ -d "uploads" ]; then find uploads -type f -not -name ".gitkeep" -exec git rm -f {} + 2>/dev/null || true; fi
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.png" \) -exec git rm -f {} + 2>/dev/null || true
          mkdir -p uploads && touch uploads/.gitkeep && git add uploads/.gitkeep 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-clean uploads [skip ci]"
            git push origin HEAD
          fi
