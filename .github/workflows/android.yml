name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find ZIP File
        id: findzip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f \( -iname "*.zip" -o -iname "*.ZIP" \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project Directory:"
          echo "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Give Execute Permission
        shell: bash
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK not found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.APK_PATH }}
