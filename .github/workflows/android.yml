name: Universal Bulletproof Android Release Builder

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
          
          ZIP_FILE=$(find uploads -type f -name "*${BUILD_ID}*.zip" 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Project zip file not found!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # ⚙️ إصلاح وتأكيد استيراد Compose Border في حال غيابه
      - name: Fix Missing Imports Automatically
        run: |
          find project_dir -type f -name "*.kt" | while read -r kt_file; do
            if grep -q "\.border(" "$kt_file" && ! grep -q "import androidx.compose.foundation.border" "$kt_file"; then
              echo "🛠️ إضافة استيراد border إلى $kt_file"
              sed -i '1s/^/import androidx.compose.foundation.border\n/' "$kt_file"
            fi
          done

      - name: Auto-Sync Package Name & Google Services
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          USER_PKG="${{ github.event.client_payload.package_name }}"
          RAW_MIN_SDK="${{ github.event.client_payload.min_sdk }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          VERSION_NAME="${{ github.event.client_payload.version_name }}"

          convert_sdk() {
            case "$1" in
              "7") echo "24" ;; "8") echo "26" ;; "9") echo "28" ;; "10") echo "29" ;;
              "11") echo "30" ;; "12") echo "31" ;; "13") echo "33" ;; "14") echo "34" ;;
              "15") echo "35" ;; "16") echo "36" ;; "17") echo "37" ;; *) echo "$1" ;;
            esac
          }
          MIN_SDK=$(convert_sdk "$RAW_MIN_SDK")

          if [ -n "$APP_NAME" ]; then
            find project_dir -type f -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" {} +
          fi

          if [ -n "$USER_PKG" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
              sed -i -E "s/(applicationId\s*=\s*)\"[^\"]+\"/\1\"$USER_PKG\"/g" "$g_file"
              sed -i -E "s/(applicationId\s+)\"[^\"]+\"/\1\"$USER_PKG\"/g" "$g_file"
              sed -i -E "s/(applicationId\.set\s*\(\s*)\"[^\"]+\"(\s*\))/\1\"$USER_PKG\"\2/g" "$g_file"
            done
          fi

          cat << 'EOF' > sync_pkg.py
          import os, re, json

          detected_pkg = ""
          for root, _, files in os.walk("project_dir"):
              for file in files:
                  if file in ["build.gradle.kts", "build.gradle"]:
                      with open(os.path.join(root, file), 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      m = re.search(r'applicationId\s*(?:=\s*|\s+)"([^"]+)"', content)
                      if m:
                          detected_pkg = m.group(1)
                          break
              if detected_pkg:
                  break

          if not detected_pkg:
              detected_pkg = "com.universal.android.app"

          dummy_data = {
              "project_info": {
                  "project_number": "123456789",
                  "project_id": "app-project-universal",
                  "storage_bucket": "app.appspot.com"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                      "android_client_info": {
                          "package_name": detected_pkg
                      }
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "AIzaSyDummyKeyForBuildSuccessPass12345"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }],
              "configuration_version": "1"
          }

          for root, dirs, files in os.walk("project_dir"):
              if os.path.basename(root) == "app" or "src" in dirs:
                  json_path = os.path.join(root, "google-services.json")
                  if os.path.exists(json_path):
                      try:
                          with open(json_path, 'r', encoding='utf-8') as f:
                              d = json.load(f)
                          if "client" in d and len(d["client"]) > 0:
                              for c in d["client"]:
                                  c["client_info"]["android_client_info"]["package_name"] = detected_pkg
                          with open(json_path, 'w', encoding='utf-8') as f:
                              json.dump(d, f, indent=2)
                      except Exception:
                          with open(json_path, 'w', encoding='utf-8') as f:
                              json.dump(dummy_data, f, indent=2)
                  else:
                      with open(json_path, 'w', encoding='utf-8') as f:
                          json.dump(dummy_data, f, indent=2)
          EOF
          python3 sync_pkg.py
          rm sync_pkg.py

          if [ -n "$MIN_SDK" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(minSdk(Version)?\s*=\s*)[0-9]+/\1$MIN_SDK/g" {} +
          fi
          if [ -n "$VERSION_CODE" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$VERSION_CODE/g" {} +
          fi
          if [ -n "$VERSION_NAME" ]; then
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"$VERSION_NAME\"/g" {} +
          fi
        continue-on-error: true

      - name: Universal Obfuscation & Play Protect Friendly Hardening
        run: |
          cat << 'EOF' > universal_hardener.py
          import os
          import re
          import random

          def encode_bytes(text, salt):
              encoded = text.encode('utf-8')
              encrypted = [f"{b ^ salt}.toByte()" for b in encoded]
              return ", ".join(encrypted)

          secured_count = 0

          for root, _, files in os.walk("project_dir"):
              for file in files:
                  if file == "AndroidManifest.xml":
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          m = f.read()
                      m = m.replace('android:allowBackup="true"', 'android:allowBackup="false"')
                      m = m.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
                      m = re.sub(r'android:debuggable="true"', '', m)
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(m)

          root_package = "com.universal.security"
          for root, dirs, files in os.walk("project_dir"):
              for file in files:
                  if file.endswith('.kt') or file.endswith('.java'):
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          first_lines = "".join([f.readline() for _ in range(5)])
                      m = re.search(r'package\s+([a-zA-Z0-9_.]+)', first_lines)
                      if m:
                          parts = m.group(1).split('.')
                          if len(parts) >= 2:
                              root_package = f"{parts[0]}.{parts[1]}.security"
                              break
              if root_package != "com.universal.security":
                  break

          vault_class_code = f"""package {root_package}

          object AppSecurityVault {{

              @JvmStatic
              fun decrypt(b: ByteArray, k: Int): String {{
                  val r = ByteArray(b.size)
                  for (i in b.indices) {{
                      r[i] = (b[i].toInt() xor k).toByte()
                  }}
                  return String(r, Charsets.UTF_8)
              }}
          }}
          """

          injected = False
          pkg_subpath = root_package.replace('.', os.sep)
          for root, dirs, files in os.walk("project_dir"):
              if root.endswith(os.path.join("src", "main", "java")) or root.endswith(os.path.join("src", "main", "kotlin")):
                  target_dir = os.path.join(root, pkg_subpath)
                  os.makedirs(target_dir, exist_ok=True)
                  with open(os.path.join(target_dir, "AppSecurityVault.kt"), "w", encoding="utf-8") as vf:
                      vf.write(vault_class_code)
                  injected = True

          if not injected:
              for root, dirs, files in os.walk("project_dir"):
                  if "src" in dirs:
                      target_dir = os.path.join(root, "src", "main", "java", pkg_subpath)
                      os.makedirs(target_dir, exist_ok=True)
                      with open(os.path.join(target_dir, "AppSecurityVault.kt"), "w", encoding="utf-8") as vf:
                          vf.write(vault_class_code)
                      break

          secret_var_pattern = r'(const\s+val|val|var)\s+([a-zA-Z0-9_]*(?:PASSWORD|PASSWD|PASS|SECRET|TOKEN|API_KEY|KEY|ADMIN|AUTH|PHONE|USERNAME|USER|CREDENTIAL|PIN|RESTAURANT|SHOP|DATABASE)[a-zA-Z0-9_]*)\s*(?::\s*String)?\s*=\s*"([^"$\r\n\\]+)"'

          for root, dirs, files in os.walk("project_dir"):
              dirs[:] = [d for d in dirs if d not in ['.git', 'build', 'node_modules', '.gradle']]
              for file in files:
                  if file.endswith('.kt') and not file.endswith('AppSecurityVault.kt'):
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      if any(k in content for k in ["@Entity", "@Dao", "@Database", "androidx.room"]):
                          continue

                      modified = False

                      def replacer(m):
                          global secured_count, modified
                          decl = m.group(1)
                          var_name = m.group(2)
                          val_str = m.group(3)

                          if val_str in ["", " "]:
                              return m.group(0)

                          salt = random.randint(110, 245)
                          b_str = encode_bytes(val_str, salt)
                          secured_count += 1
                          modified = True

                          target_decl = "var" if "var" in decl else "val"
                          return f"{target_decl} {var_name}: String = {root_package}.AppSecurityVault.decrypt(byteArrayOf({b_str}), {salt})"

                      new_content = re.sub(secret_var_pattern, replacer, content)

                      if modified:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(new_content)

          r8_rules = f"""
          -keep class {root_package}.AppSecurityVault {{ *; }}
          -dontwarn **
          -dontwarn androidx.**
          -keepclassmembers class * extends androidx.room.RoomDatabase {{ *; }}
          -keep class * extends androidx.room.RoomDatabase
          -keep @androidx.room.Entity class * {{ *; }}
          -keep @androidx.room.Dao class * {{ *; }}
          -keep class androidx.compose.** {{ *; }}
          -keep class androidx.activity.** {{ *; }}
          -keep class androidx.fragment.app.** {{ *; }}
          -assumenosideeffects class android.util.Log {{
              public static boolean isLoggable(java.lang.String, int);
              public static int v(...);
              public static int d(...);
              public static int i(...);
              public static int w(...);
              public static int e(...);
          }}
          """
          for root, dirs, files in os.walk("project_dir"):
              if os.path.basename(root) == "app":
                  p_file = os.path.join(root, "proguard-rules.pro")
                  with open(p_file, "a", encoding="utf-8") as f:
                      f.write(r8_rules)

          print(f"🔒 تم تحصين المشروع بنجاح وتشفير {secured_count} حقل حساس.")
          EOF

          python3 universal_hardener.py
          rm universal_hardener.py

          find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | while read -r g_file; do
            sed -i -E "s/(isMinifyEnabled\s*=\s*)false/\1true/g" "$g_file"
            sed -i -E "s/(minifyEnabled\s+)false/\1true/g" "$g_file"
            sed -i -E "s/(isShrinkResources\s*=\s*)false/\1true/g" "$g_file"
            sed -i -E "s/(shrinkResources\s+)false/\1true/g" "$g_file"
          done

      - name: Setup Gradle 9.3.1
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x ./gradlew
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
        continue-on-error: true

      - name: Replace Custom App Icon Cleanly
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find uploads -type f -name "*${BUILD_ID}*.png" 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            find project_dir -type d -name "*anydpi*" -exec rm -rf {} +
            find project_dir -type d \( -name "mipmap-*" -o -name "drawable-*" \) | while read -r res_dir; do
              rm -f "$res_dir"/ic_launcher*.xml "$res_dir"/ic_launcher*.webp "$res_dir"/ic_launcher*.png
              cp -f "$ICON_FILE" "$res_dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_round.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_foreground.png"
            done
          fi
        continue-on-error: true

      - name: Build & Guaranteed Apksigner (Release Only)
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          BUILD_ID="${{ github.event.client_payload.build_id }}"
          CUSTOM_PASS="${{ github.event.client_payload.keystore_password }}"

          cat << 'EOF' > resolve_keystore.py
          import os, subprocess, re, json, sys

          build_id = sys.argv[1] if len(sys.argv) > 1 else ""
          custom_pass = sys.argv[2] if len(sys.argv) > 2 else ""

          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          uploads_dir = os.path.join(workspace, "uploads")

          candidates = []
          search_dirs = [uploads_dir, workspace, "."]
          valid_exts = (".keystore", ".jks", ".p12")

          for s_dir in search_dirs:
              if os.path.exists(s_dir):
                  for root, _, files in os.walk(s_dir):
                      for file in files:
                          if file.lower().endswith(valid_exts):
                              f_path = os.path.abspath(os.path.join(root, file))
                              if os.path.getsize(f_path) > 300:
                                  if f_path not in candidates:
                                      candidates.append(f_path)

          if build_id:
              candidates.sort(key=lambda p: (0 if build_id in os.path.basename(p) else 1))

          passwords_to_try = []
          if custom_pass:
              passwords_to_try.append(custom_pass)
          for p in ["android", "123456", "password", "androidkey", "keypass", "secret"]:
              if p not in passwords_to_try:
                  passwords_to_try.append(p)

          resolved_key = None
          resolved_alias = None
          resolved_pass = None

          for cand in candidates:
              for pwd in passwords_to_try:
                  try:
                      res = subprocess.run(
                          ["keytool", "-list", "-v", "-keystore", cand, "-storepass", pwd],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                          timeout=10
                      )
                      if res.returncode == 0:
                          aliases = re.findall(r'Alias name:\s*(.+)', res.stdout, re.IGNORECASE)
                          if not aliases:
                              aliases = re.findall(r'اسم الاسم المستعار:\s*(.+)', res.stdout)
                          
                          if aliases:
                              resolved_key = cand
                              resolved_alias = aliases[0].strip()
                              resolved_pass = pwd
                              break
                  except Exception:
                      pass
              if resolved_key:
                  break

          result_payload = {
              "found": bool(resolved_key),
              "key_path": resolved_key or "",
              "alias": resolved_alias or "androidkey",
              "password": resolved_pass or "android"
          }

          with open("signing_resolved.json", "w", encoding="utf-8") as out:
              json.dump(result_payload, out, indent=2)
          EOF

          python3 resolve_keystore.py "$BUILD_ID" "$CUSTOM_PASS"
          rm -f resolve_keystore.py

          TARGET_KS="$GITHUB_WORKSPACE/universal.keystore"
          rm -f "$TARGET_KS"

          FOUND=$(python3 -c "import json; print(json.load(open('signing_resolved.json'))['found'])")
          TARGET_ALIAS=$(python3 -c "import json; print(json.load(open('signing_resolved.json'))['alias'])")
          TARGET_PASS=$(python3 -c "import json; print(json.load(open('signing_resolved.json'))['password'])")
          FOUND_PATH=$(python3 -c "import json; print(json.load(open('signing_resolved.json'))['key_path'])")
          rm -f signing_resolved.json

          if [ "$FOUND" = "True" ] && [ -f "$FOUND_PATH" ]; then
            cp -f "$FOUND_PATH" "$TARGET_KS"
          else
            TARGET_ALIAS="androidkey"
            TARGET_PASS="android"
            keytool -genkeypair -v -keystore "$TARGET_KS" \
              -alias "$TARGET_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$TARGET_PASS" \
              -keypass "$TARGET_PASS" \
              -deststoretype PKCS12 \
              -dname "CN=Android Secure, O=Android, C=US"
          fi

          cat << 'EOF' > fix_signing_syntax.py
          import os, re

          for root, dirs, files in os.walk("."):
              if "build" in dirs:
                  dirs.remove("build")
              for file in files:
                  p = os.path.join(root, file)
                  if file == "build.gradle.kts":
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          c = f.read()
                      c = re.sub(r'signingConfig\s*=\s*signingConfigs\.[a-zA-Z0-9_\(\)"\']+', 'signingConfig = signingConfigs.getByName("debug")', c)
                      c = re.sub(r'checkReleaseBuilds\s*=\s*true', 'checkReleaseBuilds = false', c)
                      c = re.sub(r'abortOnError\s*=\s*true', 'abortOnError = false', c)
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(c)

                  elif file == "build.gradle":
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          c = f.read()
                      c = re.sub(r'signingConfig\s+signingConfigs\.[a-zA-Z0-9_]+', 'signingConfig signingConfigs.debug', c)
                      c = re.sub(r'signingConfig\s*=\s*signingConfigs\.[a-zA-Z0-9_]+', 'signingConfig = signingConfigs.debug', c)
                      c = re.sub(r'checkReleaseBuilds\s+true', 'checkReleaseBuilds false', c)
                      c = re.sub(r'checkReleaseBuilds\s*=\s*true', 'checkReleaseBuilds = false', c)
                      c = re.sub(r'abortOnError\s+true', 'abortOnError false', c)
                      c = re.sub(r'abortOnError\s*=\s*true', 'abortOnError = false', c)
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(c)
          EOF
          python3 fix_signing_syntax.py
          rm -f fix_signing_syntax.py

          find "$GITHUB_WORKSPACE/project_dir" -path "*/src/main/res/*" -type f \( -name "*.jks" -o -name "*.keystore" -o -name "*.p12" \) -exec rm -f {} + 2>/dev/null || true

          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi

          if [ "$BUILD_TYPE" == "aab" ]; then
            ./gradlew clean bundleRelease -x lintVitalRelease -x lint --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.aab"
            cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          else
            ./gradlew clean assembleRelease -x lintVitalRelease -x lint --no-daemon
            RAW_APK=$(find . -path "*/build/outputs/apk/*/*.apk" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.apk"
          fi

          if [ "$BUILD_TYPE" != "aab" ]; then
            BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            
            if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
              "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_NAME" || cp "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
              "$BUILD_TOOLS_DIR/apksigner" sign --ks "$TARGET_KS" --ks-key-alias "$TARGET_ALIAS" --ks-pass "pass:$TARGET_PASS" --key-pass "pass:$TARGET_PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$GITHUB_WORKSPACE/$FINAL_NAME"
              "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$GITHUB_WORKSPACE/$FINAL_NAME" || true
            else
              cp "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
            fi
          fi

          if [ -f "$GITHUB_WORKSPACE/$FINAL_NAME" ]; then
            echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV
          fi

          if [ -f "$TARGET_KS" ]; then
            echo "KEYSTORE_ASSET=$TARGET_KS" >> $GITHUB_ENV
          fi

      - name: Extract Exact Failure Cause
        if: failure()
        run: |
          find . -name "*.log" -exec grep -Hn -E "\* What went wrong:|Execution failed for task|Compilation error" {} + 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: |
            ${{ env.FINAL_ASSET }}
            ${{ env.KEYSTORE_ASSET }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Clean Uploads Content Cleanly
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git reset --hard origin/HEAD 2>/dev/null || true
          if [ -d "uploads" ]; then find uploads -type f -not -name ".gitkeep" -exec git rm -f {} + 2>/dev/null || true; fi
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.png" -o -name "*.keystore" -o -name "*.jks" -o -name "*.p12" \) -exec git rm -f {} + 2>/dev/null || true
          mkdir -p uploads && touch uploads/.gitkeep && git add uploads/.gitkeep 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-clean uploads [skip ci]"
            git push origin HEAD
          fi
