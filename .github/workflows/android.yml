name: Universal Bulletproof Android Builder

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط المشروع واستخراج الملف المرفوع
      - name: Locate and Extract Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
          echo "🔍 جاري البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 2 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            fi

            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "⏳ محاولة ($i/10): انتظار ظهور الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على ملف المشروع المضغوط!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. تطبيق التخصيصات الاختيارية (اسم التطبيق، الإصدارات، ونطاق SDK مع الإغلاق البرمجي للأجهزة الأحدث)
      - name: Customize App Configurations
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          MIN_SDK="${{ github.event.client_payload.min_sdk }}"
          MAX_SDK="${{ github.event.client_payload.max_sdk }}"
          TARGET_SDK="${{ github.event.client_payload.target_sdk }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          VERSION_NAME="${{ github.event.client_payload.version_name }}"

          # 1. تغيير اسم التطبيق الفعلي على شاشة الهاتف داخل strings.xml
          if [ -n "$APP_NAME" ]; then
            echo "📝 تغيير اسم التطبيق على الهاتف إلى: $APP_NAME"
            find project_dir -type f -name "strings.xml" | while read -r str_file; do
              sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" "$str_file"
            done
          fi

          # 2. تعديل الحد الأدنى لنظام التشغيل (minSdk) لمنع التثبيت على الإصدارات الأقدم
          if [ -n "$MIN_SDK" ]; then
            echo "⚙️ تعيين الحد الأدنى minSdk = $MIN_SDK"
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/minSdk(Version)?(\s*=?\s*)[0-9]+/minSdk\2$MIN_SDK/g" {} +
          fi

          # 3. إغلاق التطبيق برمجياً إذا تم فتحه على نظام أعلى من maxSdk
          if [ -n "$MAX_SDK" ]; then
            echo "⚙️ تفعيل القفل البرمجي للحد الأقصى maxSdk = $MAX_SDK"
            find project_dir -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" \) | while read -r main_file; do
              sed -i "/super.onCreate/a \        if (android.os.Build.VERSION.SDK_INT > $MAX_SDK) { android.widget.Toast.makeText(this, \"هذا التطبيق غير مدعوم على إصدار نظامك\", android.widget.Toast.LENGTH_LONG).show(); finish(); return; }" "$main_file"
            done
          fi

          # 4. تعديل Target SDK إن تم تحديده
          if [ -n "$TARGET_SDK" ]; then
            echo "⚙️ تعيين Target SDK = $TARGET_SDK"
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/targetSdk(Version)?(\s*=?\s*)[0-9]+/targetSdk\2$TARGET_SDK/g" {} +
          fi

          # 5. تعديل رقم الإصدار (versionCode)
          if [ -n "$VERSION_CODE" ]; then
            echo "⚙️ تعيين versionCode = $VERSION_CODE"
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/versionCode(\s*=?\s*)[0-9]+/versionCode\1$VERSION_CODE/g" {} +
          fi

          # 6. تعديل اسم الإصدار (versionName)
          if [ -n "$VERSION_NAME" ]; then
            echo "⚙️ تعيين versionName = $VERSION_NAME"
            find project_dir -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E "s/versionName(\s*=?\s*)\"[^\"]+\"/versionName\1\"$VERSION_NAME\"/g" {} +
          fi
        continue-on-error: true

      # 4.5. تثبيت Gradle 9.3.1 المتوافق
      - name: Setup Gradle 9.3.1
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x ./gradlew

          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        continue-on-error: true

      # 4.6. استبدال الأيقونة الجذري لمنع أخطاء XML و AnyDPI
      - name: Replace Custom App Icon Cleanly
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find . -maxdepth 2 -name "*${BUILD_ID}*.png" | head -n 1)
          if [ -z "$ICON_FILE" ]; then
            ICON_FILE=$(find . -maxdepth 1 -name "*.png" | head -n 1)
          fi

          if [ -n "$ICON_FILE" ]; then
            echo "🎨 تم العثور على الأيقونة المخصصة: $ICON_FILE"
            
            # حذف مجلدات anydpi-v26 لمنع تعارض ملفات XML مع صور PNG
            find project_dir -type d -name "*anydpi*" -exec rm -rf {} +
            
            # استبدال وتوحيد الأيقونات في كافة مجلدات mipmap و drawable
            find project_dir -type d \( -name "mipmap-*" -o -name "drawable-*" \) | while read -r res_dir; do
              rm -f "$res_dir"/ic_launcher*.xml
              rm -f "$res_dir"/ic_launcher*.webp
              rm -f "$res_dir"/ic_launcher*.png
              
              cp -f "$ICON_FILE" "$res_dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_round.png"
              cp -f "$ICON_FILE" "$res_dir/ic_launcher_foreground.png"
            done
            echo "✅ تم تطبيق الأيقونة وتفريغ التعارضات بنجاح!"
          else
            echo "ℹ️ لم يتم العثور على أيقونة مرفوعة، سيتم الإبقاء على الأيقونة الأصلية."
          fi
        continue-on-error: true

      # 5. تنفيذ البناء عبر ./gradlew
      - name: Execute Gradle Build
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true
          if [ -d "app" ]; then cp -f debug.keystore app/debug.keystore || true; fi

          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name }}"
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi

          if [ "$BUILD_TYPE" == "aab" ]; then
            echo "🚀 بدء بناء حزمة AAB..."
            ./gradlew clean bundleRelease --no-daemon || ./gradlew clean bundleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.aab"
          else
            echo "🚀 بدء بناء حزمة APK..."
            ./gradlew clean assembleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)
            FINAL_NAME="${PROJECT_NAME}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "❌ فشل العثور على الملف الناتج!"
            exit 1
          fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "FINAL_ASSET=$GITHUB_WORKSPACE/$FINAL_NAME" >> $GITHUB_ENV

          echo "🔑 استخراج بصمة SHA-1..."
          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|SHA1:" || true

      # 6. نشر الملف الناتج في Release مستقل
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "${{ env.FINAL_ASSET }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. الحذف الذكي والنظيف عبر API بدون تعارضات وبدون حظر
      - name: Smart API Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          echo "🧹 جاري تنظيف الملفات المرفوعة عبر API..."
          for file in $(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" -o -name "*${BUILD_ID}*.png" | sed 's|^\./||'); do
            SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/$file" | jq -r '.sha')
            
            if [ "$SHA" != "null" ] && [ -n "$SHA" ]; then
              curl -s -X DELETE \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d "{\"message\": \"Auto-clean: delete $file\", \"sha\": \"$SHA\"}" \
                "https://api.github.com/repos/$REPO/contents/$file" > /dev/null
              echo "✅ تم حذف $file"
            fi
          done
